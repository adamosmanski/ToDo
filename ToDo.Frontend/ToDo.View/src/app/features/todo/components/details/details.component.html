<div *ngIf="task; else noSelection" class="details">
  <div class="header">
    <h2>{{ task.title }}</h2>
    <label>
      Status:
      <select [ngModel]="task.isCompleted" (ngModelChange)="onStatusChange($event)">
        <option [ngValue]="false">Nowe</option>
        <option [ngValue]="true">Zrobione</option>
      </select>
    </label>
  </div>

  <p>{{ task.description || 'Brak opisu' }}</p>
</div>

<ng-template #noSelection>
  <p>Wybierz zadanie z listy po lewej stronie.</p>
</ng-template>
